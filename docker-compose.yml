# =============================================================================
# NEXUS LOG SERVICE - DOCKER COMPOSE
# =============================================================================
# Khởi chạy độc lập Log Service:
#   CSDL chính lưu trên Neon Cloud (PostgreSQL)
#   docker compose up -d
# =============================================================================

services:

  # 1. Ứng dụng Log Service RESTful Web API (Port 8004)
  log-service:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: nexus-log-service
    ports:
      - "${LOG_SERVICE_PORT:-8004}:8004"
    extra_hosts:
      - "host.docker.internal:host-gateway"
    environment:
      - ASPNETCORE_ENVIRONMENT=${ASPNETCORE_ENVIRONMENT:-Development}
      - ConnectionStrings__DefaultConnection=${LOG_CONNECTION_STRING:-${CONNECTION_STRING}}
      - OTEL_EXPORTER_OTLP_ENDPOINT=${OTEL_EXPORTER_OTLP_ENDPOINT:-http://tempo:4317}
    restart: unless-stopped

networks:
  default:
    name: nexus-network
    external: true
