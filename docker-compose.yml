# =============================================================================
# NEXUS LOG SERVICE - DOCKER COMPOSE
# =============================================================================
# Khởi chạy độc lập Log Service kèm Cơ sở dữ liệu riêng:
#   docker compose up -d
# =============================================================================

services:

  # 1. Cơ sở dữ liệu Log Service (Port 5436)
  log-db:
    image: postgres:16-alpine
    container_name: nexus-log-db
    environment:
      POSTGRES_DB: log_db
      POSTGRES_USER: ${POSTGRES_USER:-postgres}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-MatkhaucuaTui123@}
    ports:
      - "${LOG_DB_PORT:-5436}:5432"
    volumes:
      - log_db_data:/var/lib/postgresql/data
    restart: unless-stopped
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-postgres} -d log_db"]
      interval: 1m
      timeout: 30s
      retries: 5
      start_period: 60s

  # 2. Ứng dụng Log Service gRPC (Port 8004)
  log-service:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: nexus-log-service
    ports:
      - "${LOG_SERVICE_PORT:-8004}:8004"
    extra_hosts:
      - "host.docker.internal:host-gateway"
    environment:
      - ASPNETCORE_ENVIRONMENT=${ASPNETCORE_ENVIRONMENT:-Development}
      - ConnectionStrings__DefaultConnection=Host=log-db;Port=5432;Database=log_db;Username=${POSTGRES_USER:-postgres};Password=${POSTGRES_PASSWORD:-MatkhaucuaTui123@}
      - RabbitMq__Host=${RABBITMQ_HOST:-rabbitmq}
      - RabbitMq__Port=${RABBITMQ_PORT:-5672}
      - RabbitMq__User=${RABBITMQ_USER:-guest}
      - RabbitMq__Password=${RABBITMQ_PASSWORD:-MatkhaucuaTui123@}
      - OTEL_EXPORTER_OTLP_ENDPOINT=${OTEL_EXPORTER_OTLP_ENDPOINT:-http://tempo:4317}
    depends_on:
      log-db:
        condition: service_healthy
    restart: unless-stopped

networks:
  default:
    name: nexus-network

volumes:
  log_db_data:
    name: nexus-be_log_db_data
