services:
  postgres-log:
    image: postgres:16-alpine
    container_name: nexus-postgres-log
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-postgres}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-postgres}
      POSTGRES_DB: log_db
    ports:
      - "${LOG_DB_PORT:-5436}:5432"
    volumes:
      - postgres_log_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-postgres} -d log_db"]
      interval: 10s
      timeout: 5s
      retries: 5
    restart: unless-stopped

volumes:
  postgres_log_data:
    name: nexus-local_postgres_log_data

networks:
  default:
    name: nexus-network
    external: true
